version: '3.8'

services:
  backend:
    image: backend
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # Mount the source for live editing; run with `--reload` if desired.
      - ../backend:/app/backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mydatabase
      - GAME_STORE=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        # The browser talks to the backend, so this must be reachable from the host.
        - REACT_APP_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    command: ["serve", "-s", "build", "-l", "3000"]
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
