name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # matches docker/backend.Dockerfile
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://user:password@localhost:5432/mydatabase
        run: python -m unittest -v backend.game.env_testing backend.test_api backend.test_leaderboard

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18  # matches docker/frontend.Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (warnings fail the build)
        run: npm run build
        env:
          CI: true
